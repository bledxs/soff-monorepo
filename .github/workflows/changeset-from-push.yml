name: Changeset from Direct Push

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  create-changeset:
    # Skip if commit is from bot (to avoid loops)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.author.name, 'github-actions') &&
        !contains(github.event.head_commit.message, 'chore: add changeset') &&
        !contains(github.event.head_commit.message, 'chore: version packages')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture changed files
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --name-only HEAD^ HEAD > changed-files.txt
            else
              git ls-tree -r --name-only "$AFTER" > changed-files.txt
            fi
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed-files.txt
          fi

          echo "Changed files:"
          cat changed-files.txt

      - name: Check if changeset already exists for this commit
        id: check
        run: |
          CHANGESET_ADDED=$(grep -E '^\.changeset/.*\.md$' changed-files.txt | grep -v 'README.md' || true)
          if [ -n "$CHANGESET_ADDED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Changeset already exists in this commit"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve release title
        if: steps.check.outputs.skip != 'true'
        id: release-title
        run: |
          TITLE=$(git log -1 --pretty=%s)

          if [[ "$TITLE" =~ ^Merge\ pull\ request\ #([0-9]+) ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q '.title')

            if [ -n "$PR_TITLE" ]; then
              TITLE="$PR_TITLE"
            fi
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump from commit message
        if: steps.check.outputs.skip != 'true'
        id: bump
        run: |
          TITLE="${{ steps.release-title.outputs.title }}"

          # Check for breaking change indicator
          if [[ "$TITLE" == *"!"* ]] || [[ "$TITLE" == *"BREAKING"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$TITLE" =~ ^feat ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "$TITLE" =~ ^(fix|perf|refactor|style|docs|test|chore|ci|build) ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

          # Extract description (remove conventional commit prefix)
          DESC=$(echo "$TITLE" | sed -E 's/^(feat|fix|perf|refactor|style|docs|test|chore|ci|build)(\([^)]*\))?!?:\s*//')
          echo "description=$DESC" >> $GITHUB_OUTPUT

      - name: Determine affected packages from changed files
        if: steps.check.outputs.skip != 'true'
        id: packages
        run: |
          PACKAGES=""

          # Get changed files in this push
          CHANGED_FILES=$(cat changed-files.txt)

          CHANGED_DIRS=$(echo "$CHANGED_FILES" | grep "^packages/[^/]*/" | cut -d/ -f2 | sort | uniq || true)

          for dir in $CHANGED_DIRS; do
            PACKAGE_JSON="packages/$dir/package.json"
            if [ -f "$PACKAGE_JSON" ]; then
              PKG_NAME=$(node -p "try { const pkg = require('./$PACKAGE_JSON'); pkg.private ? '' : pkg.name } catch(e) { '' }")
              
              if [ -n "$PKG_NAME" ]; then
                PACKAGES="$PACKAGES $PKG_NAME"
              fi
            fi
          done

          # Trim leading space
          PACKAGES=$(echo $PACKAGES | xargs)

          echo "list=$PACKAGES" >> $GITHUB_OUTPUT
          echo "Affected packages: $PACKAGES"

      - name: Create changeset file
        if: steps.check.outputs.skip != 'true' && steps.packages.outputs.list != ''
        id: changeset
        run: |
          PACKAGES="${{ steps.packages.outputs.list }}"
          TYPE="${{ steps.bump.outputs.type }}"
          DESC="${{ steps.bump.outputs.description }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA=${SHORT_SHA:0:7}

          if [ -z "$DESC" ]; then
            DESC="Update packages from commit $SHORT_SHA"
          fi

          # Generate unique filename
          FILENAME=".changeset/push-${SHORT_SHA}-$(date +%s).md"

          # Create changeset content
          echo "---" > "$FILENAME"
          for pkg in $PACKAGES; do
            echo "\"$pkg\": $TYPE" >> "$FILENAME"
          done
          echo "---" >> "$FILENAME"
          echo "" >> "$FILENAME"
          echo "$DESC" >> "$FILENAME"

          echo "Created changeset:"
          cat "$FILENAME"

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.skip != 'true' && steps.packages.outputs.list != ''
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for ${{ steps.changeset.outputs.short_sha }}'
          branch: 'changeset/push-${{ steps.changeset.outputs.short_sha }}'
          delete-branch: true
          title: 'chore: add changeset for ${{ steps.changeset.outputs.short_sha }}'
          body: |
            Automatically created changeset for commit ${{ steps.changeset.outputs.short_sha }}.

            Based on changes in packages: ${{ steps.packages.outputs.list }}
          base: master
          add-paths: |
            .changeset/*.md
          labels: automated

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number
        continue-on-error: true
        run: gh pr merge --merge --auto "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
